name: "Publish (project)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (project)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=// --filter=sponsor-gated-support --filter=sponsor-gated-support-docs --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=sponsor-gated-support --filter=sponsor-gated-support-docs --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (github-action/packages-sponsor-gated-support)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-github-action-packages-sponsor-gated-support"
          retention-days: 1
          path: |
            packages/sponsor-gated-support/build

      - name: "Upload build artifacts (github-pages-docusaurus/apps-docs)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-github-pages-docusaurus-apps-docs"
          retention-days: 1
          path: |
            apps/docs/build

  publish-github-action-packages-sponsor-gated-support:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "write"
      id-token: "write"
      attestations: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-github-action-packages-sponsor-gated-support"
          path: "./packages/sponsor-gated-support/build"

      - name: "Configure git identity"
        if: "${{ env.PUBLISH == 'true' }}"
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "Verify release context"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          TAG_NAME: "${{ github.event.release.tag_name }}"
        run: |
          set -euo pipefail
          if [ -z "$TAG_NAME" ]; then
            echo "::error::The github-action target requires a release.published event with a tag name. Manual workflow_dispatch with dry-run=false is not supported."
            exit 1
          fi

      - name: "Initialize release workspace"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG_NAME: "${{ github.event.release.tag_name }}"
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          git init -b "releases"
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git config --local http.https://github.com/.extraheader "Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"

          # If the release branch exists remotely, fetch and reset to it so the new commit lands on top.
          if git ls-remote --exit-code --heads origin "releases" > /dev/null; then
            git fetch origin "releases"
            git reset --hard "origin/releases"

            # Guard: block re-releases when the releases branch already carries this version.
            LAST_MSG="$(git log -1 --format='%s' 2>/dev/null || true)"
            if [ "$LAST_MSG" = "Release $TAG_NAME" ]; then
              echo "::error::Version $TAG_NAME was already published to the releases branch. Delete the existing release before re-publishing."
              exit 1
            fi

            git rm -rf . > /dev/null 2>&1 || true
          fi

      - name: "Stage release tree"
        if: "${{ env.PUBLISH == 'true' }}"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          STAGE="$RUNNER_TEMP/release"

          # Required: action.yml and the built action directory.
          cp "./action.yml" "$STAGE/action.yml"
          mkdir -p "$STAGE/action"
          cp -R "./packages/sponsor-gated-support/build/." "$STAGE/action/"

          # Repoint action.yml at the bundled entry in the flattened release tree. The
          # source action.yml resolves runs.main against the working layout; the published
          # tree carries only action.yml plus the bundle under action/, so runs.main must
          # resolve there instead. Only the main key inside the runs block is rewritten.
          sed -i -E '/^runs:/,$ s#^([[:space:]]+main:[[:space:]]*).*#\1"action/index.js"#' "$STAGE/action.yml"

          # Optional: common community-repo files. Prefer workspace-level over root.
          for optional in README.md LICENSE SECURITY.md NOTICE CHANGELOG.md; do
            if [ -f "./packages/sponsor-gated-support/$optional" ]; then
              cp "./packages/sponsor-gated-support/$optional" "$STAGE/$optional"
            elif [ -f "$optional" ]; then
              cp "$optional" "$STAGE/$optional"
            fi
          done

      - name: "Commit and push release"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          TAG_NAME: "${{ github.event.release.tag_name }}"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          git add -A
          git commit -m "Release $TAG_NAME"
          git push origin "releases" --force

      - name: "Force-retag semver and floating major"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          TAG_NAME: "${{ github.event.release.tag_name }}"
          IS_PRERELEASE: "${{ github.event.release.prerelease }}"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"

          # Re-point the semver tag onto the orphan commit (GitHub created it on main; we move it).
          git tag -f "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME" --force

          # Derive floating major (e.g., v2.1.3 -> v2; primary-v1.2.3 -> primary-v1).
          # Skips the major retag when the tag isn't <prefix->v<digits> shaped or when
          # the release is marked as a prerelease — the floating major should only
          # track stable releases.
          MAJOR="$(printf '%s' "$TAG_NAME" | sed -E 's/^(([a-zA-Z][a-zA-Z0-9_-]*-)?v[0-9]+).*/\1/')"
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Release $TAG_NAME is marked as a prerelease; skipping floating major retag."
          elif [ "$MAJOR" = "$TAG_NAME" ]; then
            echo "Tag $TAG_NAME is not v-prefixed semver; skipping floating major retag."
          else
            git tag -f "$MAJOR"
            git push origin "refs/tags/$MAJOR" --force
          fi

      - name: "Attest build provenance"
        if: "${{ env.PUBLISH == 'true' }}"
        uses: "actions/attest-build-provenance@v2"
        with:
          subject-path: "./packages/sponsor-gated-support/build/index.js"

  publish-github-pages-docusaurus-apps-docs:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-github-pages-docusaurus-apps-docs"
          path: "./apps/docs/build"

      - name: "Check GitHub Pages status"
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "[Pages] GitHub Pages is enabled."
            echo "PAGES_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "[Pages] GitHub Pages is not enabled. Skipping deployment."
            echo "PAGES_ENABLED=false" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Setup GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/configure-pages@v6"

      - name: "Upload artifact to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/upload-pages-artifact@v5"
        with:
          path: "./apps/docs/build"

      - name: "Deploy to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/deploy-pages@v5"
